<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Hudson Valley Powerlifting</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px 16px;
        }

        .logo {
            width: 220px;
            max-width: 70vw;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        p {
            color: #a3a3a3;
            margin-bottom: 32px;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .btn-primary {
            background: #dc2626;
        }

        .btn:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body>
    <main>
        <a href="/"><img class="logo" src="/images/HVPL-Logo-White-Transparent.svg" alt="Hudson Valley Powerlifting"></a>
        <h1>Page not found</h1>
        <p>That page doesn't exist or has moved.</p>
        <div class="links">
            <a href="/" class="btn btn-primary">Home</a>
            <a href="/members" class="btn">Memberships</a>
            <a href="/events" class="btn">Events</a>
            <a href="/contact" class="btn">Contact</a>
        </div>
    </main>
</body>
</html>
